<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#02030a" />
        <link rel="stylesheet" href="styles/style.css" />
        <title>Moonlit Homestead</title>
    </head>
    <body>
        <main id="scene" aria-label="A moonlit homestead beneath the Milky Way">
            <img
                class="layer sky"
                src="layers/Sky%20Galaxy%20.png"
                alt=""
                draggable="false"
            />
            <div class="layer moon parallax" data-depth="0.035">
                <img src="layers/Moon%20Lunar.png" alt="" draggable="false" />
            </div>
            <div class="layer tower parallax" data-depth="0.055">
                <img src="layers/Tower.png" alt="" draggable="false" />
            </div>
            <div class="layer fan parallax" data-depth="0.07">
                <img src="layers/Fan.png" alt="" draggable="false" />
            </div>
            <div class="layer house parallax" data-depth="0.045">
                <img src="layers/House.png" alt="" draggable="false" />
            </div>
            <div class="layer courage parallax" data-depth="0.065">
                <img src="layers/Courage%20Fig.png" alt="" draggable="false" />
            </div>
            <div class="layer hadassah parallax" data-depth="0.075">
                <img src="layers/Hadassah%20Fig.png" alt="" draggable="false" />
            </div>
            <div class="layer my-fig parallax" data-depth="0.085">
                <img src="layers/My%20fig.png" alt="" draggable="false" />
            </div>
            <div class="layer ground parallax" data-depth="0.025">
                <img src="layers/Ground.png" alt="" draggable="false" />
            </div>
        </main>
        <script src="scripts/script.js"></script>
    </body>
</html>
